# Add this file inside the active HTTPS server block for www.deshengtest.com.
# The production deployment script installs these directives after checking
# the active certificate paths and existing server blocks.

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  application/javascript
  application/json
  application/xml
  image/svg+xml;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' mailto:; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;

# Keep legacy product URLs discoverable while consolidating them on the new pages.
location = /dth.html {
  return 301 /product-constant-temperature-humidity.html;
}

location = /dath.html {
  return 301 /product-walk-in-chamber.html;
}

location = /rapid-temperature.html {
  return 301 /product-rapid-temperature.html;
}

location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
  expires 1y;
  try_files $uri =404;
}

location ~* \.(?:html|xml|txt|webmanifest)$ {
  expires 5m;
  try_files $uri =404;
}
